[project]
name = "public-images"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mayank", email = "mayank31313@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "diffusers>=0.42.1",
    "langchain>=1.4.9",
]

[project.scripts]
public-images = "public_images:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

dependencies = [
  "torch>=2.11.0",
  "torchvision>=0.26.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

name: Build transformers_base

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build:
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker-build-push.yml
    with:
      target: transformers_base
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}

name: Docker Build and Push

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Compose image
        id: build-and-push
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yaml
          targets: transformers_base
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            transformers_base.tags=ghcr.io/mayank31313/transformers_base:latest
            transformers_base.tags+=ghcr.io/mayank31313/transformers_base:${{ github.sha }}
            transformers_base.cache-from=type=gha
            transformers_base.cache-to=type=gha,mode=max

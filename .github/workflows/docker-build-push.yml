name: Docker Build and Push

on:
  workflow_call:
    inputs:
      target:
        description: Docker Bake target to build
        required: true
        type: string
    secrets:
      github_token:
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.github_token }}

      - name: Build and push image
        id: build-and-push
        uses: docker/bake-action@v6
        with:
          source: .
          files: docker-compose.yaml
          targets: ${{ inputs.target }}
          push: ${{ github.event_name != 'pull_request' }}
          set: |
            ${{ inputs.target }}.tags=ghcr.io/mayank31313/${{ inputs.target }}:latest
            ${{ inputs.target }}.tags+=ghcr.io/mayank31313/${{ inputs.target }}:${{ github.sha }}
            ${{ inputs.target }}.cache-from=type=gha,scope=${{ inputs.target }}
            ${{ inputs.target }}.cache-to=type=gha,scope=${{ inputs.target }},mode=max